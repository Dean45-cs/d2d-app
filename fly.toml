# Konfiguration für Fly.io.
# Vor dem ersten Deploy: "app" auf den eigenen, freien Namen ändern.
#
# Wichtig: Die Datenbank ist SQLite und verträgt nur EINE laufende Maschine.
# min_machines_running bleibt deshalb bei 1 und es wird nicht hochskaliert.

app = "d2d-app"
primary_region = "fra"

[build]

[env]
  NODE_ENV = "production"
  DATABASE_PATH = "/data/d2d.db"
  NEXT_PUBLIC_TARIFRECHNER_URL = "https://portal-ep24.de/menues/tarifrechner/"
  # Energiekarte: "seed" = Demo-Beispielwerte. Für echte Tagespreise auf
  # "csv" oder "json" umstellen und ENERGY_FEED_URL als Secret setzen.
  ENERGY_FEED_MODE = "seed"

[[mounts]]
  source = "d2d_data"
  destination = "/data"

[http_service]
  internal_port = 3000
  force_https = true
  # Die Maschine bleibt an: sie holt einmal täglich die Energiepreise und
  # ein schlafender Server würde den Außendienst Sekunden kosten.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [[http_service.checks]]
    grace_period = "20s"
    interval = "30s"
    method = "GET"
    timeout = "5s"
    path = "/login"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
