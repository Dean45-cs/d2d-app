<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />
    <title>Keine Verbindung · Carlsson Sales</title>
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <style>
      /* Ohne Netz geladen: alles steht hier, nichts kommt von aussen.
         Farben wie in docs/DESIGN.md (hell und dunkel). */
      :root {
        color-scheme: light dark;
        --bg: #f2f2f7;
        --surface: #ffffff;
        --ink: #0b0b0d;
        --muted: #68686f;
        --accent-ink: #0d6b32;
        --accent-tint: rgb(47 209 97 / 0.16);
        --accent-edge: rgb(31 157 76 / 0.34);
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #000000;
          --surface: #1c1c1e;
          --ink: #f5f5f7;
          --muted: #a1a1a8;
          --accent-ink: #34d66b;
          --accent-tint: rgb(48 209 88 / 0.2);
          --accent-edge: rgb(48 209 88 / 0.4);
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: max(24px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right))
          max(24px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
        background: var(--bg);
        color: var(--ink);
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, "Segoe UI", Roboto, sans-serif;
        -webkit-font-smoothing: antialiased;
        text-align: center;
      }
      main {
        width: 100%;
        max-width: 22rem;
        padding: 40px 24px 32px;
        border-radius: 20px;
        background: var(--surface);
      }
      svg {
        display: block;
        margin: 0 auto 20px;
        border-radius: 18px;
      }
      h1 {
        margin: 0 0 4px;
        font-size: 1.375rem;
        line-height: 1.75rem;
        font-weight: 700;
      }
      p {
        margin: 0 0 24px;
        font-size: 0.9375rem;
        line-height: 1.25rem;
        color: var(--muted);
      }
      button {
        width: 100%;
        min-height: 56px;
        border: 0;
        border-radius: 9999px;
        background: var(--accent-tint);
        box-shadow: inset 0 0 0 1px var(--accent-edge);
        color: var(--accent-ink);
        font: inherit;
        font-size: 1.0625rem;
        font-weight: 600;
        cursor: pointer;
      }
      button:active {
        transform: scale(0.97);
      }
      button:focus-visible {
        outline: 3px solid var(--accent-ink);
        outline-offset: 2px;
      }
    </style>
  </head>
  <body>
    <main>
      <svg width="72" height="72" viewBox="0 0 100 100" aria-hidden="true">
        <defs>
          <linearGradient id="cs-bg" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#46e38e"/>
            <stop offset=".52" stop-color="#17a852"/>
            <stop offset="1" stop-color="#06612f"/>
          </linearGradient>
          <radialGradient id="cs-light" cx=".2" cy=".08" r=".9">
            <stop offset="0" stop-color="#fff" stop-opacity=".3"/>
            <stop offset=".55" stop-color="#fff" stop-opacity="0"/>
          </radialGradient>
          <linearGradient id="cs-rim" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#fff" stop-opacity=".45"/>
            <stop offset=".3" stop-color="#fff" stop-opacity="0"/>
            <stop offset=".75" stop-color="#000" stop-opacity="0"/>
            <stop offset="1" stop-color="#000" stop-opacity=".16"/>
          </linearGradient>
          <linearGradient id="cs-ring" x1=".1" y1=".1" x2=".9" y2=".9">
            <stop offset="0" stop-color="#fff"/>
            <stop offset="1" stop-color="#cff7de"/>
          </linearGradient>
          <radialGradient id="cs-dot" cx=".36" cy=".3" r=".8">
            <stop offset="0" stop-color="#fff"/>
            <stop offset="1" stop-color="#d4f9e1"/>
          </radialGradient>
          <radialGradient id="cs-halo">
            <stop offset="0" stop-color="#f0fff5" stop-opacity=".8"/>
            <stop offset=".42" stop-color="#bdffd6" stop-opacity=".3"/>
            <stop offset="1" stop-color="#bdffd6" stop-opacity="0"/>
          </radialGradient>
          <filter id="cs-shadow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="1.6"/>
          </filter>
        </defs>
        <rect width="100" height="100" rx="22.4" fill="url(#cs-bg)"/>
        <rect width="100" height="100" rx="22.4" fill="url(#cs-light)"/>
        <rect x=".5" y=".5" width="99" height="99" rx="21.9" fill="none" stroke="url(#cs-rim)"/>
        <g fill="#00361a" opacity=".3" filter="url(#cs-shadow)" transform="translate(0 2.2)">
          <path d="M82.5 50C82.54 54.25 81.74 58.52 80.17 62.5C78.6 66.47 76.24 70.15 73.26 73.26C70.28 76.37 66.68 78.91 62.71 80.68C58.74 82.45 54.39 83.44 50 83.57C45.61 83.7 41.16 82.95 37 81.38C32.84 79.8 28.97 77.39 25.69 74.31C22.41 71.22 19.73 67.47 17.86 63.31C15.99 59.16 14.95 54.61 14.82 50C14.69 45.39 15.49 40.74 17.16 36.4C18.84 32.06 21.4 28.03 24.65 24.65C27.9 21.27 31.85 18.53 36.19 16.65C40.53 14.78 45.25 13.79 50 13.75A7.25 7.25 0 0 1 50 28.25C47.15 28.21 44.29 28.73 41.62 29.76C38.94 30.8 36.45 32.35 34.34 34.34C32.22 36.32 30.48 38.73 29.25 41.41C28.02 44.08 27.31 47.01 27.18 50C27.05 52.99 27.52 56.02 28.55 58.88C29.59 61.74 31.21 64.42 33.29 66.71C35.38 68.99 37.95 70.88 40.8 72.21C43.66 73.54 46.8 74.3 50 74.43C53.2 74.56 56.45 74.04 59.49 72.9C62.53 71.77 65.36 70.01 67.75 67.75C70.14 65.49 72.08 62.74 73.41 59.7C74.75 56.66 75.46 53.34 75.5 50A3.5 3.5 0 0 1 82.5 50Z"/>
          <circle cx="71.2" cy="28.8" r="6.75"/>
        </g>
        <circle cx="71.2" cy="28.8" r="16" fill="url(#cs-halo)"/>
        <path d="M82.5 50C82.54 54.25 81.74 58.52 80.17 62.5C78.6 66.47 76.24 70.15 73.26 73.26C70.28 76.37 66.68 78.91 62.71 80.68C58.74 82.45 54.39 83.44 50 83.57C45.61 83.7 41.16 82.95 37 81.38C32.84 79.8 28.97 77.39 25.69 74.31C22.41 71.22 19.73 67.47 17.86 63.31C15.99 59.16 14.95 54.61 14.82 50C14.69 45.39 15.49 40.74 17.16 36.4C18.84 32.06 21.4 28.03 24.65 24.65C27.9 21.27 31.85 18.53 36.19 16.65C40.53 14.78 45.25 13.79 50 13.75A7.25 7.25 0 0 1 50 28.25C47.15 28.21 44.29 28.73 41.62 29.76C38.94 30.8 36.45 32.35 34.34 34.34C32.22 36.32 30.48 38.73 29.25 41.41C28.02 44.08 27.31 47.01 27.18 50C27.05 52.99 27.52 56.02 28.55 58.88C29.59 61.74 31.21 64.42 33.29 66.71C35.38 68.99 37.95 70.88 40.8 72.21C43.66 73.54 46.8 74.3 50 74.43C53.2 74.56 56.45 74.04 59.49 72.9C62.53 71.77 65.36 70.01 67.75 67.75C70.14 65.49 72.08 62.74 73.41 59.7C74.75 56.66 75.46 53.34 75.5 50A3.5 3.5 0 0 1 82.5 50Z" fill="url(#cs-ring)"/>
        <circle cx="71.2" cy="28.8" r="6.75" fill="url(#cs-dot)"/>
      </svg>
      <h1>Keine Verbindung</h1>
      <p>Erfasste Türen bleiben auf dem Gerät und werden nachgesendet, sobald wieder Netz da ist.</p>
      <button type="button" onclick="location.reload()">Erneut versuchen</button>
    </main>
  </body>
</html>
